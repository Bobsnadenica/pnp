<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Malkokote | Extra</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Inter:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" media="print" onload="this.media='all'">
    <noscript>
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Inter:wght@400;500;600;700&display=swap">
    </noscript>
    <link rel="stylesheet" href="/gallery/styles.css">
</head>
<body data-gallery-mode="extra" class="age-gate-pending">
    <div id="age-gate" class="age-gate" role="dialog" aria-modal="true" aria-labelledby="age-gate-title">
        <div class="age-gate-card">
            <p class="age-gate-kicker">18+</p>
            <h1 id="age-gate-title">Adults only</h1>
            <p class="age-gate-copy">This website contains adult modeling and photography content. Enter only if you are 18 or older.</p>
            <p class="age-gate-copy age-gate-copy-secondary">Този сайт съдържа 18+ моделни и фотографски материали. Влезте само ако сте навършили 18 години.</p>
            <div class="age-gate-actions">
                <button class="btn btn-primary" type="button" data-age-enter>Enter</button>
                <button class="btn btn-secondary" type="button" data-age-leave>Leave</button>
            </div>
        </div>
    </div>

    <div class="shell">
        <header class="topbar">
            <a class="brand" href="/" aria-label="Malkokote home">
                <img class="brand-logo" src="/logo.png" alt="Little Kitty malkokote.com">
            </a>
            <div class="top-actions">
                <button id="gallery-refresh" class="btn btn-secondary" type="button">Refresh</button>
                <button id="gallery-signout" class="btn btn-primary" type="button">Sign Out</button>
            </div>
        </header>

        <section class="gallery-card">
            <p id="gallery-status" class="gallery-status">Loading.</p>
            <div id="gallery-content" class="loading-state"></div>
        </section>
    </div>

    <script src="/age-gate.js" defer></script>
    <script src="/config/site-config.js" defer></script>
    <script src="/auth/auth.js" defer></script>
    <script src="/gallery/app.js" defer></script>
</body>
</html>
