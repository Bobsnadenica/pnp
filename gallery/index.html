<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="/logo.png">
    <title>Malkokote | Extra</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Inter:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" media="print" onload="this.media='all'">
    <noscript>
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Inter:wght@400;500;600;700&display=swap">
    </noscript>
    <link rel="stylesheet" href="/gallery/styles.css">
</head>
<body data-gallery-mode="extra" data-page-id="extra" class="age-gate-pending">
    <div id="age-gate" class="age-gate" role="dialog" aria-modal="true" aria-labelledby="age-gate-title" aria-describedby="age-gate-copy">
        <div class="age-gate-card">
            <p class="age-gate-kicker">18+</p>
            <h1 id="age-gate-title" data-i18n="adultsOnly">Adults only</h1>
            <p id="age-gate-copy" class="age-gate-copy" data-i18n="ageGateCopy">This website contains adult modeling and photography content. Enter only if you are 18 or older.</p>
            <div class="age-gate-actions">
                <button class="btn btn-primary" type="button" data-age-enter data-i18n="enter">Enter</button>
                <button class="btn btn-secondary" type="button" data-age-leave data-i18n="leave">Leave</button>
            </div>
        </div>
    </div>

    <div class="shell">
        <header class="topbar">
            <a class="brand" href="/">
                <img src="/logo.png" alt="" class="site-logo">
                <span data-i18n-en="Malkokote" data-i18n-bg="Malkokote" data-i18n-ru="Malkokote">Malkokote</span>
            </a>
            <div class="topbar-group">
                <div class="language-dropdown">
                    <button class="language-pill" type="button" data-language-toggle aria-label="Select Language">
                        <span data-current-language-flag>🇬🇧</span>
                        <svg class="pill-chevron" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
                    </button>
                    <div class="language-menu" hidden>
                        <button class="language-item" type="button" data-language-option="en" aria-label="English">🇬🇧 English</button>
                        <button class="language-item" type="button" data-language-option="bg" aria-label="Bulgarian">🇧🇬 Български</button>
                        <button class="language-item" type="button" data-language-option="ja" aria-label="Japanese">🇯🇵 日本語</button>
                        <button class="language-item" type="button" data-language-option="fr" aria-label="French">🇫🇷 Français</button>
                        <button class="language-item" type="button" data-language-option="de" aria-label="German">🇩🇪 Deutsch</button>
                        <button class="language-item" type="button" data-language-option="tr" aria-label="Turkish">🇹🇷 Türkçe</button>
                        <button class="language-item" type="button" data-language-option="ru" aria-label="Russian">🇷🇺 Русский</button>
                        <button class="language-item" type="button" data-language-option="es" aria-label="Spanish">🇪🇸 Español</button>
                        <button class="language-item" type="button" data-language-option="it" aria-label="Italian">🇮🇹 Italiano</button>
                        <button class="language-item" type="button" data-language-option="pt" aria-label="Portuguese">🇵🇹 Português</button>
                        <button class="language-item" type="button" data-language-option="zh" aria-label="Chinese">🇨🇳 中文</button>
                        <button class="language-item" type="button" data-language-option="ko" aria-label="Korean">🇰🇷 한국어</button>
                        <button class="language-item" type="button" data-language-option="ar" aria-label="Arabic">🇸🇦 العربية</button>
                    </div>
                </div>
                <div class="top-actions">
                    <a href="/buy.html" class="btn btn-secondary" data-i18n="buy">Buy</a>
                    <button id="gallery-refresh" class="btn btn-secondary" data-i18n="refresh" type="button">Refresh</button>
                    <button id="gallery-signout" class="btn btn-primary" data-i18n="signOut" type="button">Sign Out</button>
                </div>
            </div>
        </header>

        <main>
            <h1 class="sr-only">Private member gallery</h1>
            <section class="gallery-card" aria-live="polite">
                <p id="gallery-status" class="gallery-status">Loading.</p>
                <div id="gallery-content" class="loading-state"></div>
            </section>
        </main>
    </div>

    <script src="/language.js" defer></script>
    <script src="/age-gate.js" defer></script>
    <script src="/config/site-config.js" defer></script>
    <script src="/auth/auth.js" defer></script>
    <script src="/gallery/app.js" defer></script>
</body>
</html>
