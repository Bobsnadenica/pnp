<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>[NEW_SITE_NAME]</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" media="print" onload="this.media='all'">
    <noscript>
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
    </noscript>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <div class="site-frame">
        <header class="site-header">
            <a class="site-mark" href="/">[NEW_SITE_NAME]</a>
            <button class="ghost-button" type="button" data-profile-trigger data-signed-out-text="Login" data-signed-in-text="Extra">
                <span data-profile-label>Login</span>
            </button>
        </header>

        <main class="public-gallery-shell">
            <p id="public-gallery-status" class="gallery-status" hidden></p>
            <div id="public-gallery-grid" class="public-gallery-grid" aria-live="polite"></div>
        </main>
    </div>

    <div id="login-modal" class="modal-shell" role="dialog" aria-modal="true" aria-hidden="true" aria-labelledby="login-modal-title">
        <div class="modal-backdrop" data-modal-close></div>
        <div class="modal-card">
            <button class="modal-close" type="button" aria-label="Close sign-in dialog" data-modal-close>&times;</button>
            <h2 id="login-modal-title">Login</h2>
            <form id="login-form" class="login-form">
                <input id="login-email" type="email" placeholder="Email" autocomplete="email" aria-label="Email address">
                <div class="modal-actions">
                    <button id="login-submit" class="primary-button" type="submit" data-idle-text="Continue" data-loading-text="Redirecting...">Continue</button>
                </div>
            </form>
            <div id="account-panel" class="account-panel" hidden>
                <p id="account-summary">Signed in.</p>
                <div class="modal-actions">
                    <a class="primary-button button-link" href="/gallery/">Open Extra</a>
                    <button id="account-signout" class="secondary-button button-link" type="button">Sign Out</button>
                </div>
            </div>
            <p id="login-feedback" class="login-feedback" hidden></p>
        </div>
    </div>

    <script src="/config/site-config.js" defer></script>
    <script src="/auth/auth.js" defer></script>
    <script src="/script.js" defer></script>
</body>
</html>
