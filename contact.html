<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Malkokote | Contact</title>
    <meta name="description" content="Contact Malkokote for modeling, photography, portfolio work, and inquiries. коте, малко коте, работа, модел, снимки.">
    <meta name="keywords" content="Malkokote, contact, modeling, photography, portfolio, работа, модел, снимки, коте, малко коте">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="https://www.malkokote.com/contact.html">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" media="print" onload="this.media='all'">
    <noscript>
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
    </noscript>
    <link rel="stylesheet" href="/style.css">
</head>
<body class="age-gate-pending">
    <div id="age-gate" class="age-gate" role="dialog" aria-modal="true" aria-labelledby="age-gate-title">
        <div class="age-gate-card">
            <p class="age-gate-kicker">18+</p>
            <h1 id="age-gate-title">Adults only</h1>
            <p class="age-gate-copy">This website contains adult modeling and photography content. Enter only if you are 18 or older.</p>
            <p class="age-gate-copy age-gate-copy-secondary">Този сайт съдържа 18+ моделни и фотографски материали. Влезте само ако сте навършили 18 години.</p>
            <div class="age-gate-actions">
                <button class="primary-button" type="button" data-age-enter>Enter</button>
                <button class="ghost-button" type="button" data-age-leave>Leave</button>
            </div>
        </div>
    </div>

    <div class="site-frame">
        <header class="site-header">
            <a class="site-mark" href="/">Malkokote</a>
            <div class="site-actions">
                <a class="ghost-button button-link" href="/">Gallery</a>
                <button class="ghost-button" type="button" data-profile-trigger data-signed-out-text="Login" data-signed-in-text="Extra">
                    <span data-profile-label>Login</span>
                </button>
            </div>
        </header>

        <main class="contact-shell">
            <a class="contact-link" href="mailto:contactus@malkokote.com">contactus@malkokote.com</a>
        </main>
    </div>

    <div id="login-modal" class="modal-shell" role="dialog" aria-modal="true" aria-hidden="true" aria-labelledby="login-modal-title">
        <div class="modal-backdrop" data-modal-close></div>
        <div class="modal-card">
            <button class="modal-close" type="button" aria-label="Close sign-in dialog" data-modal-close>&times;</button>
            <h2 id="login-modal-title">Login</h2>
            <form id="login-form" class="login-form">
                <input id="login-email" type="email" placeholder="Email" autocomplete="email" aria-label="Email address">
                <div class="modal-actions">
                    <button id="login-submit" class="primary-button" type="submit" data-idle-text="Continue" data-loading-text="Redirecting...">Continue</button>
                </div>
            </form>
            <div id="account-panel" class="account-panel" hidden>
                <p id="account-summary">Signed in.</p>
                <div class="modal-actions">
                    <a class="primary-button button-link" href="/gallery/">Open Extra</a>
                    <button id="account-signout" class="secondary-button button-link" type="button">Sign Out</button>
                </div>
            </div>
            <p id="login-feedback" class="login-feedback" hidden></p>
        </div>
    </div>

    <script src="/age-gate.js" defer></script>
    <script src="/config/site-config.js" defer></script>
    <script src="/auth/auth.js" defer></script>
    <script src="/script.js" defer></script>
</body>
</html>
